# seeinpm test config

[server]
addr = ":999"

[tls]
enabled = true
cert_file = ""
key_file = ""

[auth]
jwt_secret = ""
jwt_expire = 1800
jwt_refresh_expire = 86400

[database]
path = "data/seeinpm.db"

[logging]
level = "info"
path = "logs"
max_size = 100
max_backups = 7

[port_pool]
ranges = [
    { start = 20000, end = 20100 }
]
