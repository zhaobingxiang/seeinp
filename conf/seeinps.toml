[server]
server_addr = "see.timesee.cn:99"

[auth]
# 发布模板刻意留空，不携带任何真实用户凭证。
# 真实 username/auth_code 由部署工具生成配置时注入，或用户首次打开管理页完成初始化时填写。
username = ""
auth_code = ""

[tls]
enabled = true
skip_verify = true

[local]
bend_addr = ":65443"

[logging]
level = "info"
path = "logs"
max_size = 100
max_backups = 7

[audit]
# true = 不可逆/高敏感操作（删除代理）先写审计再执行，审计落库失败则拒绝该操作。
# false（默认）= best-effort：审计写入失败记 ERROR 日志，业务照常进行。
fail_closed = false
