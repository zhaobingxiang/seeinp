# seeinpm configuration

[server]
addr = ":99"      # 信令/控制通道监听（TLS）
http_addr = ":90" # B端 Web + API 监听

[tls]
enabled = true
cert_file = ""  # Empty for auto-generate
key_file = ""   # Empty for auto-generate

[auth]
jwt_secret = ""  # Empty for auto-generate
jwt_expire = 1800  # 30 minutes in seconds
jwt_refresh_expire = 86400  # 24 hours in seconds

[database]
path = "data/seeinpm.db"

[logging]
level = "info"  # debug, info, warn, error
path = "logs"
max_size = 100  # MB
max_backups = 7

[audit]
# true = 不可逆/高敏感操作（删除用户、重置授权码、删除升级包）先写审计再执行，
# 审计落库失败则拒绝该操作，杜绝"动作成功但审计缺失"；代价是 DB 异常时这些操作也会失败。
# false（默认）= best-effort：审计写入失败记 ERROR 日志，业务照常进行。
fail_closed = false

[port_pool]
ranges = [
    { start = 20000, end = 30000 }
]
